<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dynex | Kontrol Paneli</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080a10;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

header{
    height:72px;
    background:#0d1018;
    border-bottom:1px solid #222938;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-size:20px;
    font-weight:bold;
}

.logoIcon{
    width:40px;
    height:40px;
    border-radius:11px;
    background:#5865f2;
    display:flex;
    align-items:center;
    justify-content:center;
}

.robotLogo{
    font-size:27px;
    display:flex;
    width:100%;
    height:100%;
    align-items:center;
    justify-content:center;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
    color:#c8cdd8;
}

.user img{
    width:36px;
    height:36px;
    border-radius:50%;
}

.container{
    width:92%;
    max-width:1100px;
    margin:auto;
    padding:45px 0;
}

h1{
    margin-bottom:8px;
}

.subtitle{
    color:#858c9e;
    margin-bottom:32px;
}

.serverGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:18px;
}

.card{
    background:#10141e;
    border:1px solid #222938;
    border-radius:16px;
    padding:21px;
    transition:.2s;
}

.card:hover{
    border-color:#343d55;
    transform:translateY(-2px);
}

.serverTop{
    display:flex;
    align-items:center;
    gap:15px;
}

.serverIcon{
    width:58px;
    height:58px;
    border-radius:16px;
    background:#5865f2;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:20px;
    font-weight:bold;
}

.serverIcon img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.serverName{
    font-weight:bold;
    font-size:16px;
}

.status{
    color:#858c9e;
    font-size:13px;
    margin-top:15px;
}

button{
    width:100%;
    border:0;
    border-radius:9px;
    padding:12px;
    margin-top:17px;
    color:#fff;
    background:#5865f2;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#4752c4;
}

.invite{
    background:#202636;
}

.invite:hover{
    background:#2b3345;
}

.disabled{
    background:#171b25;
    color:#777f90;
    cursor:not-allowed;
}

.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.loginBox{
    width:420px;
    max-width:90%;
    background:#10141e;
    border:1px solid #222938;
    border-radius:20px;
    padding:40px;
    text-align:center;
}

.bigLogo{
    width:90px;
    height:90px;
    border-radius:24px;
    margin:auto;
    background:#5865f2;
    display:flex;
    align-items:center;
    justify-content:center;
}

.bigLogo .robotLogo{
    font-size:52px;
}

.loginBox h1{
    margin-top:20px;
}

.loginBox p{
    color:#858c9e;
    line-height:1.5;
    margin:14px 0 25px;
}

.loginButton{
    background:#5865f2;
}

.loginButton:hover{
    background:#4752c4;
}

.hidden{
    display:none;
}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .container{
        padding:30px 0;
    }

    .serverGrid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div id="loginScreen" class="login">

    <div class="loginBox">

        <div class="bigLogo">
            <span class="robotLogo">🤖</span>
        </div>

        <h1>Dynex</h1>

        <p>
            Dynex kontrol paneline erişmek için
            Discord hesabınla giriş yap.
        </p>

        <button
            class="loginButton"
            onclick="discordLogin()">

            Discord ile Giriş Yap

        </button>

    </div>

</div>


<div id="dashboard" class="hidden">

<header>

    <div class="logo">

        <div class="logoIcon">
            <span class="robotLogo">🤖</span>
        </div>

        Dynex

    </div>

    <div id="userInfo"></div>

</header>


<div class="container">

    <h1>
        Sunucu Rehberi
    </h1>

    <div class="subtitle">
        Discord hesabındaki sunucular
    </div>

    <div id="serverGrid" class="serverGrid">

        <div class="status">
            Sunucular yükleniyor...
        </div>

    </div>

</div>

</div>


<script>

/* ========================================
   DISCORD GİRİŞİ
======================================== */

function discordLogin(){

    window.location.href =
        "/.netlify/functions/login";

}


/* ========================================
   CALLBACK'TEN GELEN KULLANICI
======================================== */

function checkDiscordLogin(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const discordId =
        params.get("discord_id");

    const username =
        params.get("username");


    if(!discordId || !username){

        return false;

    }


    document
        .getElementById("loginScreen")
        .classList.add("hidden");


    document
        .getElementById("dashboard")
        .classList.remove("hidden");


    showUser({
        id: discordId,
        username: username
    });


    document
        .getElementById("serverGrid")
        .innerHTML = `

            <div class="card">

                <div class="status">

                    🟢 Discord hesabın başarıyla
                    doğrulandı.

                </div>

                <button
                    onclick="loadServers()">

                    🔄 Sunucuları Yükle

                </button>

            </div>

        `;


    return true;

}


/* ========================================
   KULLANICI
======================================== */

function showUser(user){

    const element =
        document.getElementById(
            "userInfo"
        );


    element.innerHTML = `

        <div class="user">

            <span>
                ${escapeHTML(user.username)}
            </span>

        </div>

    `;

}


/* ========================================
   SUNUCULAR
======================================== */

async function loadServers(){

    const container =
        document.getElementById(
            "serverGrid"
        );


    container.innerHTML = `

        <div class="card">

            <div class="status">

                🔄 Sunucular yükleniyor...

            </div>

        </div>

    `;


    try{

        const response =
            await fetch(
                "/.netlify/functions/dashboard"
            );


        if(!response.ok){

            throw new Error(
                "Sunucular alınamadı."
            );

        }


        const data =
            await response.json();


        showServers(
            data.guilds || []
        );

    }

    catch(error){

        console.error(error);

        container.innerHTML = `

            <div class="card">

                <div class="status">

                    ❌ Sunucular yüklenemedi.

                </div>

            </div>

        `;

    }

}


/* ========================================
   SUNUCULARI GÖSTER
======================================== */

function showServers(guilds){

    const container =
        document.getElementById(
            "serverGrid"
        );


    container.innerHTML = "";


    if(!guilds.length){

        container.innerHTML = `

            <div class="card">

                <div class="status">

                    Discord hesabında
                    sunucu bulunamadı.

                </div>

            </div>

        `;

        return;

    }


    guilds.forEach(guild=>{

        let icon;


        if(guild.icon){

            icon = `

                <img
                    src="${escapeHTML(guild.icon)}"
                    alt="Sunucu">

            `;

        }

        else{

            icon =
                escapeHTML(
                    guild.name
                        .charAt(0)
                        .toUpperCase()
                );

        }


        let action;


        if(!guild.canManage){

            action = `

                <div class="status">

                    ⛔ Bu sunucuyu yönetme
                    yetkin yok.

                </div>

                <button
                    class="disabled"
                    disabled>

                    Erişim Yok

                </button>

            `;

        }

        else if(guild.botInstalled){

            action = `

                <div class="status">

                    🟢 Dynex bu sunucuda kurulu.

                </div>

                <button
                    onclick="openPanel('${escapeHTML(guild.id)}')">

                    🎫 Kontrol Paneli

                </button>

            `;

        }

        else{

            action = `

                <div class="status">

                    ⚪ Dynex bu sunucuda kurulu değil.

                </div>

                <button
                    class="invite"
                    onclick="inviteBot('${escapeHTML(guild.id)}')">

                    ➕ Dynex'i Davet Et

                </button>

            `;

        }


        container.innerHTML += `

            <div class="card">

                <div class="serverTop">

                    <div class="serverIcon">

                        ${icon}

                    </div>

                    <div class="serverName">

                        ${escapeHTML(guild.name)}

                    </div>

                </div>

                ${action}

            </div>

        `;

    });

}


/* ========================================
   KONTROL PANELİ
======================================== */

function openPanel(guildId){

    window.location.href =
        "/panel.html?guild=" +
        encodeURIComponent(guildId);

}


/* ========================================
   BOT DAVET
======================================== */

function inviteBot(guildId){

    window.location.href =
        "/invite/" +
        encodeURIComponent(guildId);

}


/* ========================================
   GÜVENLİ HTML
======================================== */

function escapeHTML(text){

    return String(text)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ========================================
   BAŞLAT
======================================== */

if(!checkDiscordLogin()){

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

}

</script>

</body>
</html>
